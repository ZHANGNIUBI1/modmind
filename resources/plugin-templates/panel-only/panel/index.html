<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>仅面板插件模板</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      color: var(--mm-text, #1f2937);
      background: var(--mm-bg, transparent);
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { margin: 0 0 16px; font-size: 13px; opacity: 0.7; }
    .card {
      border: 1px solid var(--mm-border, rgba(128,128,128,.3));
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    button {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--mm-border, rgba(128,128,128,.4));
      background: var(--mm-surface, rgba(128,128,128,.08));
      color: inherit;
      cursor: pointer;
      font-size: 13px;
    }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  </style>
</head>
<body>
  <h1>我的面板插件</h1>
  <p class="sub">运行在沙箱 iframe 中，通过 window.parent.postMessage 与宿主通信。</p>

  <div class="card">
    <strong>项目信息（需 project.read 权限）</strong>
    <pre id="projectInfo">未加载</pre>
    <button id="loadProject">读取项目信息</button>
  </div>

  <div class="card">
    <strong>面板日志</strong>
    <p style="font-size:12px;opacity:.7">向宿主诊断输出发送一条面板日志。</p>
    <button id="ping">发送日志</button>
  </div>

  <script>
    const HOST_ORIGIN = '*' // 沙箱源唯一且随机，宿主侧会校验 e.source 归属
    let requestSeq = 0
    const pending = new Map()

    function send(message) { window.parent.postMessage(message, HOST_ORIGIN) }

    function applyTheme(theme) {
      const dark = theme === 'dark'
      const values = dark
        ? { '--mm-bg': '#1f2024', '--mm-text': '#f0f1f3', '--mm-border': '#484a50', '--mm-surface': '#2a2c31' }
        : { '--mm-bg': '#ffffff', '--mm-text': '#1f2937', '--mm-border': '#d8dadd', '--mm-surface': '#f4f5f7' }
      for (const [name, value] of Object.entries(values)) document.documentElement.style.setProperty(name, value)
    }

    function request(payload) {
      return new Promise((resolve, reject) => {
        const requestId = `req-${Date.now()}-${requestSeq += 1}`
        pending.set(requestId, { resolve, reject })
        send({ ...payload, requestId })
      })
    }

    window.addEventListener('message', (event) => {
      const data = event.data
      if (!data || typeof data !== 'object') return
      if (data.type === 'hostInfo') {
        applyTheme(data.hostInfo?.theme)
        document.getElementById('projectInfo').textContent = JSON.stringify(data.hostInfo?.project ?? null, null, 2)
        return
      }
      if (data.type === 'result') {
        const entry = pending.get(data.requestId)
        if (!entry) return
        pending.delete(data.requestId)
        if (data.ok) entry.resolve(data.result)
        else entry.reject(new Error(data.error))
      }
    })

    send({ type: 'ready' })

    document.getElementById('loadProject').addEventListener('click', async () => {
      try {
        const info = await request({ type: 'getProjectInfo' })
        document.getElementById('projectInfo').textContent = JSON.stringify(info, null, 2)
      } catch (error) {
        document.getElementById('projectInfo').textContent = `失败：${error.message}`
      }
    })

    document.getElementById('ping').addEventListener('click', () => {
      send({ type: 'log', level: 'info', message: '面板日志测试' })
    })
  </script>
</body>
</html>
