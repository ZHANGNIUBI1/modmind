name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "resources/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"
      - "electron.vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Package unsigned macOS test artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --publish never --config.directories.output=release-macos --config.mac.identity=null --config.mac.icon=resources/icon.png

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ModMind-macOS-unsigned
          path: |
            release-macos/*.dmg
            release-macos/*.zip
          if-no-files-found: error
          retention-days: 30
