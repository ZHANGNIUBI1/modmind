name: TWA Android Build

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 1.0.0)'
        required: false
        default: ''
      versionCode:
        description: 'versionCode (integer, must increase every release)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-twa

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::secret TWA_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > etherstudio-release.keystore
          cat > keystore.properties <<EOF
          storeFile=etherstudio-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Apply version overrides
        if: ${{ inputs.versionName != '' || inputs.versionCode != '' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.versionName }}" ]; then ARGS="$ARGS -PversionName=${{ inputs.versionName }}"; fi
          if [ -n "${{ inputs.versionCode }}" ]; then ARGS="$ARGS -PversionCode=${{ inputs.versionCode }}"; fi
          echo "GRADLE_EXTRA_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Build release bundle and APK
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease $GRADLE_EXTRA_ARGS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etherstudio-twa-release
          path: |
            android-twa/app/build/outputs/bundle/release/app-release.aab
            android-twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
